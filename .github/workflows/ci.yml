name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Astro and TypeScript checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Tests (unit + built-site smoke checks)
        run: npm test

  discord-bootstrap:
    name: Discord bootstrap tool (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Tests run against an in-memory Discord API fake only: no Discord
    # credentials, no secrets, no network calls to Discord from CI.
    defaults:
      run:
        working-directory: tools/discord-bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js (from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/discord-bootstrap/package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Tests (mocked Discord API)
        run: npm test

      - name: Build
        run: npm run build
